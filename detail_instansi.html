<!DOCTYPE html>
<html lang="id" class="scroll-smooth dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Informasi Layanan Instansi | Virtual Tour Kabupaten Bandung</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        bg: 'var(--color-bg)',
                        surface: 'var(--color-surface)',
                        primary: '#10B981',
                        primaryDark: '#059669',
                        textMain: 'var(--color-text-main)',
                        textMuted: 'var(--color-text-muted)',
                        borderLine: 'var(--color-border)'
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --color-bg: #F8FAFC;
            --color-surface: #FFFFFF;
            --color-text-main: #0F172A;
            --color-text-muted: #64748B;
            --color-border: rgba(0, 0, 0, 0.08);

            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.05);
            --glass-shadow: 0 4px 20px -1px rgba(0, 0, 0, 0.1);

            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        .dark {
            --color-bg: #050505;
            --color-surface: #0F0F0F;
            --color-text-main: #F8FAFC;
            --color-text-muted: #94a3b8;
            --color-border: rgba(255, 255, 255, 0.08);

            --glass-bg: rgba(15, 15, 15, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);

            --nav-bg: rgba(5, 5, 5, 0.7);
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .bg-pattern {
            background-image: radial-gradient(var(--color-border) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .html-content p {
            margin-bottom: 0.75em;
        }

        .html-content p:last-child {
            margin-bottom: 0;
        }

        .html-content ul {
            list-style-type: disc;
            padding-left: 1.5em;
            margin-bottom: 0.75em;
        }

        .html-content ol {
            list-style-type: decimal;
            padding-left: 1.5em;
            margin-bottom: 0.75em;
        }

        .html-content a {
            color: #10B981;
            text-decoration: underline;
        }

        .html-content strong,
        .html-content b {
            font-weight: 700;
        }

        .html-content em,
        .html-content i {
            font-style: italic;
        }
    </style>
</head>

<body class="selection:bg-primary selection:text-white min-h-screen flex flex-col relative overflow-x-hidden font-sans">

    <!-- Background Art -->
    <div class="fixed inset-0 z-0 pointer-events-none bg-pattern opacity-50"></div>
    <div
        class="fixed top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary/5 blur-[100px] pointer-events-none z-0">
    </div>
    <div
        class="fixed bottom-[-20%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-emerald-500/5 blur-[100px] pointer-events-none z-0">
    </div>

    <!-- ====== MAIN CONTENT ====== -->
    <main class="flex-1 flex flex-col items-center justify-center py-8 px-4 sm:px-6 relative z-10">

        <div class="w-full max-w-3xl glass-card rounded-3xl p-6 sm:p-8 md:p-12 animate-fade-in-up">

            <!-- Dynamic Instansi Container -->
            <div id="instansi-detail-container">
            </div>

            <!-- Modal Layanan Detail Container -->
            <div id="layanan-detail-modal" class="hidden mt-8 pt-8 border-t border-borderLine">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-textMain flex items-center gap-2">
                        <i class="fa-solid fa-file-contract text-primary"></i>
                        Detail Rincian Layanan
                    </h3>
                    <button onclick="closeLayananModal()"
                        class="text-textMuted hover:text-primary text-sm font-bold flex items-center gap-1">
                        <i class="fa-solid fa-xmark text-lg"></i> Tutup
                    </button>
                </div>
                <div id="layanan-modal-body" class="space-y-6">
                </div>
            </div>

            <!-- Logo Virtual Tour Di Tengah -->
            <div class="mt-10 flex justify-center items-center">
                <div
                    class="p-4 bg-surface/50 border border-borderLine rounded-2xl shadow-sm hover:border-primary/40 transition-all flex items-center justify-center">
                    <img src="assets/img/logo/vrlogo.png" alt="Virtual Tour Logo" class="h-12 w-auto object-contain"
                        onerror="this.outerHTML='<span class=\'text-xs font-bold text-primary flex items-center gap-2\'><i class=\'fa-solid fa-vr-cardboard text-2xl\'></i> VIRTUAL TOUR KAB. BANDUNG</span>'">
                </div>
            </div>

        </div>
    </main>

    <!-- ====== FOOTER ====== -->
    <footer class="border-t border-borderLine bg-bg/80 backdrop-blur-md relative z-10 mt-auto">
        <div class="max-w-7xl mx-auto px-6 py-6 text-center">
            <p class="text-textMuted text-xs font-medium">
                © 2026 Pemerintah Kabupaten Bandung. Seluruh Hak Dilindungi.
            </p>
        </div>
    </footer>

    <script>
        let HTML_DATABASE = {};
        let currentSlug = '';
        let isLoading = true;
        let isError = false;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const instansiParam = urlParams.get('instansi') || urlParams.get('slug');
            const layananParam = urlParams.get('layanan');

            if (instansiParam) {
                currentSlug = instansiParam;
                
                attemptLiveApiFetch(currentSlug).then(() => {
                    if (layananParam && !isError) {
                        renderLayananModalHTML(layananParam);
                    }
                });
            } else {
                isError = true;
                isLoading = false;
                renderInstansiHTML(null);
            }
        });

        function renderInstansiHTML(slug) {
            const container = document.getElementById('instansi-detail-container');

            if (isLoading) {
                container.innerHTML = '<div class="text-center py-20 text-textMuted"><i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-primary"></i><p class="font-bold">Mengambil data dari API...</p></div>';
                return;
            }

            if (isError || !HTML_DATABASE[slug]) {
                container.innerHTML = '<div class="text-center py-20 text-red-500"><i class="fa-solid fa-triangle-exclamation text-4xl mb-4"></i><p class="font-bold">Instansi tidak ditemukan atau gagal memuat data.</p><a href="index.html" class="inline-block mt-4 px-5 py-2 bg-primary/10 hover:bg-primary text-primary hover:text-white rounded-xl transition font-bold">Kembali ke Beranda</a></div>';
                return;
            }

            const data = HTML_DATABASE[slug];

            const logoHtml = data.logo
                ? `<img src="${data.logo}" alt="Logo ${escapeHtml(data.nama)}" class="w-full h-full object-contain" onerror="this.outerHTML='<div class=\\'text-center text-gray-400\\'><i class=\\'fa-solid fa-building-columns text-3xl mb-1\\'></i><p class=\\'text-[10px] font-bold\\'>${data.slug.toUpperCase()}</p></div>'">`
                : `<div class="text-center text-gray-400"><i class="fa-solid fa-building-columns text-3xl mb-1"></i><p class="text-[10px] font-bold">${data.slug.toUpperCase()}</p></div>`;

            let layananListHtml = '';
            if (data.layanan && data.layanan.length > 0) {
                layananListHtml = `
                    <ul class="space-y-2 text-textMain font-semibold text-sm sm:text-base">
                        ${data.layanan.map(lay => `
                            <li class="flex items-center justify-between p-2.5 rounded-xl bg-surface/40 hover:bg-surface/80 border border-borderLine/50 transition">
                                <span class="flex items-center gap-2">
                                    <i class="fa-solid fa-chevron-right text-primary text-xs"></i>
                                    ${escapeHtml(lay.nama)}
                                </span>
                                <button onclick="renderLayananModalHTML('${lay.slug}')" class="px-3 py-1 bg-primary/10 hover:bg-primary text-primary hover:text-white border border-primary/20 rounded-lg text-xs font-bold transition">
                                    Detail <i class="fa-solid fa-arrow-right ml-1"></i>
                                </button>
                            </li>
                        `).join('')}
                    </ul>
                `;
            } else {
                layananListHtml = '<p class="text-sm text-textMuted italic">Belum ada data layanan.</p>';
            }

            container.innerHTML = `
                <div class="flex flex-col md:flex-row gap-6 md:gap-8 items-start md:items-center border-b border-borderLine pb-8 mb-8">
                    <div class="w-24 h-24 md:w-32 md:h-32 shrink-0 bg-white rounded-2xl border border-borderLine p-4 flex items-center justify-center shadow-sm">
                        ${logoHtml}
                    </div>
                    
                    <div>
                        <div class="inline-block px-3 py-1 bg-primary/10 border border-primary/20 rounded-full text-primary text-[10px] font-bold uppercase tracking-widest mb-3">
                            ${escapeHtml(data.kategori)}
                        </div>
                        <h2 class="text-3xl md:text-4xl font-extrabold text-textMain tracking-tight mb-2">
                            ${escapeHtml(data.nama)}
                        </h2>
                        <p class="text-textMuted text-sm font-medium flex items-center gap-2">
                            <i class="fa-solid fa-building-flag text-primary/70"></i>
                            Instansi Pelayanan Publik MPP Kabupaten Bandung
                        </p>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="flex items-start gap-4 p-4 rounded-2xl hover:bg-surface/50 transition border border-transparent hover:border-borderLine">
                        <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center shrink-0 mt-1">
                            <i class="fa-solid fa-location-dot text-primary"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold uppercase tracking-widest text-textMuted mb-1">Lokasi Ruangan</h4>
                            <p class="text-textMain font-semibold text-lg">${escapeHtml(data.lokasiLoket)}</p>
                        </div>
                    </div>

                    <div class="flex items-start gap-4 p-4 rounded-2xl hover:bg-surface/50 transition border border-transparent hover:border-borderLine">
                        <div class="w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center shrink-0 mt-1">
                            <i class="fa-solid fa-list-check text-emerald-500"></i>
                        </div>
                        <div class="flex-1">
                            <h4 class="text-xs font-bold uppercase tracking-widest text-textMuted mb-3">Layanan (${data.layanan ? data.layanan.length : 0})</h4>
                            ${layananListHtml}
                        </div>
                    </div>

                    <div class="flex items-start gap-4 p-4 rounded-2xl hover:bg-surface/50 transition border border-transparent hover:border-borderLine">
                        <div class="w-10 h-10 rounded-full bg-amber-500/10 flex items-center justify-center shrink-0 mt-1">
                            <i class="fa-solid fa-clock text-amber-500"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold uppercase tracking-widest text-textMuted mb-1">Jam Layanan</h4>
                            <p class="text-primary font-bold text-sm mt-1">${escapeHtml(data.jamPelayanan)}</p>
                        </div>
                    </div>

                    <div class="pt-2 w-full overflow-hidden">
                        <h4 class="text-xs font-bold uppercase tracking-widest text-textMuted mb-3 pl-2 border-l-2 border-primary">Deskripsi</h4>
                        <div class="bg-surface/50 border border-borderLine rounded-2xl p-5 md:p-6 shadow-inner w-full overflow-hidden">
                            <div class="text-textMain leading-relaxed font-medium text-sm sm:text-base html-content break-words whitespace-pre-wrap">
                                ${data.deskripsi || '-'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function changeInstansi(slug) {
            if (!slug) return;
            currentSlug = slug;
            closeLayananModal();
            attemptLiveApiFetch(slug);

            const newUrl = window.location.pathname + '?instansi=' + slug;
            window.history.pushState({ path: newUrl }, '', newUrl);
        }

        function renderLayananModalHTML(layananSlug) {
            const modal = document.getElementById('layanan-detail-modal');
            const modalBody = document.getElementById('layanan-modal-body');

            const instansiData = HTML_DATABASE[currentSlug];
            let layData = null;

            if (instansiData && instansiData.layanan) {
                layData = instansiData.layanan.find(l => l.slug === layananSlug);
            }

            modal.classList.remove('hidden');
            modal.scrollIntoView({ behavior: 'smooth' });

            if (layData) {
                modalBody.innerHTML = `
                    <div class="bg-surface/50 border border-borderLine rounded-2xl p-6 space-y-5">
                        <div class="flex flex-wrap justify-between items-start gap-4 pb-4 border-b border-borderLine">
                            <div>
                                <span class="px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 text-emerald-500 rounded-full text-[10px] font-bold uppercase tracking-widest">
                                    ${layData.status === 'gratis' ? 'GRATIS / TANPA BIAYA' : (layData.biaya || 'BERBAYAR')}
                                </span>
                                <h4 class="text-2xl font-bold text-textMain mt-2">${escapeHtml(layData.nama)}</h4>
                            </div>
                        </div>

                        ${layData.deskripsi ? `
                            <div class="w-full overflow-hidden">
                                <h5 class="text-xs font-bold uppercase tracking-widest text-textMuted mb-2">Deskripsi</h5>
                                <div class="text-sm text-textMain leading-relaxed font-medium bg-surface/80 p-4 rounded-xl border border-borderLine html-content break-words whitespace-pre-wrap w-full overflow-hidden">
                                    ${layData.deskripsi}
                                </div>
                            </div>
                        ` : ''}

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <h5 class="text-xs font-bold uppercase tracking-widest text-textMuted mb-2"><i class="fa-solid fa-list-check text-primary mr-1"></i> Persyaratan Berkas</h5>
                                <div class="text-xs sm:text-sm text-textMain leading-relaxed font-medium bg-surface/80 p-4 rounded-xl border border-borderLine whitespace-pre-line">
                                    ${layData.persyaratan || 'Lihat di website resmi atau tanyakan di loket layanan.'}
                                </div>
                            </div>
                            <div>
                                <h5 class="text-xs font-bold uppercase tracking-widest text-textMuted mb-2"><i class="fa-solid fa-diagram-project text-emerald-500 mr-1"></i> Prosedur & Alur</h5>
                                <div class="text-xs sm:text-sm text-textMain leading-relaxed font-medium bg-surface/80 p-4 rounded-xl border border-borderLine whitespace-pre-line">
                                    ${layData.prosedur || 'Silakan datang langsung ke loket MPP untuk informasi lebih lanjut.'}
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                            <div class="p-4 rounded-xl bg-surface/80 border border-borderLine flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary shrink-0">
                                    <i class="fa-solid fa-stopwatch text-lg"></i>
                                </div>
                                <div>
                                    <h6 class="text-[10px] font-bold uppercase tracking-widest text-textMuted">Waktu Penyelesaian</h6>
                                    <p class="text-sm font-bold text-textMain">${escapeHtml(layData.waktuPenyelesaian || '-')}</p>
                                </div>
                            </div>
                            <div class="p-4 rounded-xl bg-surface/80 border border-borderLine flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-500 shrink-0">
                                    <i class="fa-solid fa-wallet text-lg"></i>
                                </div>
                                <div>
                                    <h6 class="text-[10px] font-bold uppercase tracking-widest text-textMuted">Biaya Layanan</h6>
                                    <p class="text-sm font-bold text-textMain">${escapeHtml(layData.biaya || 'Gratis')}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                modalBody.innerHTML = `
                    <div class="p-6 bg-surface/50 border border-borderLine rounded-2xl text-center text-textMuted">
                        <p class="font-bold text-textMain mb-1">Layanan: ${escapeHtml(layananSlug)}</p>
                        <p class="text-xs">Informasi layanan tidak ditemukan dalam database saat ini.</p>
                    </div>
                `;
            }
        }

        function closeLayananModal() {
            document.getElementById('layanan-detail-modal').classList.add('hidden');
        }

        async function attemptLiveApiFetch(slug) {
            isLoading = true;
            isError = false;
            renderInstansiHTML(slug);

            try {
                const liveUrl = `https://mpp.bandungkab.com/api/vt/instansi/${slug}`;
                const res = await fetch(`proxy.php?url=${encodeURIComponent(liveUrl)}`);
                if (res.ok) {
                    const json = await res.json();
                    if (json.status === 'success' && json.data) {
                        const apiData = json.data;
                        const locationText = apiData.lokasiLoket || apiData.lantai || 'Lantai 1';
                        const finalLokasi = (apiData.lantai && apiData.lokasiLoket && !apiData.lokasiLoket.toLowerCase().includes(apiData.lantai.toLowerCase())) 
                            ? apiData.lantai + ', ' + apiData.lokasiLoket 
                            : locationText;

                        HTML_DATABASE[slug] = {
                            nama: apiData.nama,
                            slug: apiData.slug,
                            kategori: apiData.kategori?.nama || 'Pelayanan Publik',
                            logo: apiData.logo ? (apiData.logo.startsWith('http') ? apiData.logo : 'https://mpp.bandungkab.com' + apiData.logo) : '',
                            lokasiLoket: finalLokasi,
                            jamPelayanan: apiData.jamPelayanan || '',
                            kontak: apiData.kontak || '-',
                            deskripsi: apiData.deskripsi || '',
                            layanan: apiData.layanan || []
                        };
                        isLoading = false;
                        renderInstansiHTML(slug);
                    } else {
                        throw new Error('Data tidak valid dari API');
                    }
                } else {
                    throw new Error('Gagal menghubungi API');
                }
            } catch (e) {
                console.error("API Fetch Error:", e);
                isError = true;
                isLoading = false;
                renderInstansiHTML(slug);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>

</html>
